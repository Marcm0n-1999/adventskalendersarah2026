<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b261d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Advent">
<meta name="robots" content="noindex,nofollow">
<title>Adventskalender</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230d2d23'/%3E%3Cpath fill='%23d9b46a' d='M12 3.5l2.4 5.2 5.7.7-4.2 3.9 1.1 5.6L12 16.1 7 18.9l1.1-5.6L3.900 9.400l5.700-.7z'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="media/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="snow" aria-hidden="true"></canvas>

<main id="app">
  <header class="hero">
    <svg id="lights" class="lights" aria-hidden="true"></svg>
    <button id="secretStar" class="secret-star" aria-label="Stern">
      <svg viewBox="0 0 24 24"><use href="#i-star"/></svg>
    </button>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <div class="divider" aria-hidden="true"><i></i><svg viewBox="0 0 24 24"><use href="#i-star"/></svg><i></i></div>
    <p class="greeting" id="greeting"></p>
    <p class="status" id="status"></p>
  </header>

  <section id="grid" class="grid" aria-label="Türchen"></section>

  <footer class="foot">
    <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-heart"/></svg>
    <span id="footText"></span>
  </footer>
</main>

<div id="testBanner" class="test-banner" hidden>
  <span>Testmodus · alle Türchen offen</span>
  <button id="exitTest" type="button">Beenden</button>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- Türchen-Ansicht -->
<div id="modal" class="modal" aria-hidden="true">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <button id="closeBtn" class="close" type="button" aria-label="Schließen">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
    <div class="sheet-head">
      <svg class="head-star" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg>
      <p class="sheet-eyebrow" id="sheetEyebrow"></p>
      <h2 id="sheetTitle"></h2>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<!-- Passwort-Dialog (Testmodus) -->
<div id="pwModal" class="modal pw" aria-hidden="true">
  <form class="pw-card" id="pwForm" autocomplete="off">
    <svg class="head-star" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg>
    <h3>Testmodus</h3>
    <p>Bitte Passwort eingeben.</p>
    <input id="pwInput" type="password" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Passwort" aria-label="Passwort">
    <p class="pw-err" id="pwErr" aria-live="polite"></p>
    <div class="pw-actions">
      <button type="button" id="pwCancel" class="btn ghost">Abbrechen</button>
      <button type="submit" class="btn">Öffnen</button>
    </div>
  </form>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

<!-- Icons -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5l2.9 6.2 6.8.8-5 4.7 1.3 6.7L12 17.600 6 20.900l1.300-6.700-5-4.700 6.800-.800z"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.350l-1.450-1.320C5.400 15.360 2 12.280 2 8.500 2 5.420 4.420 3 7.500 3c1.740 0 3.410.810 4.500 2.090C13.090 3.810 14.760 3 16.500 3 19.580 3 22 5.420 22 8.500c0 3.780-3.400 6.860-8.550 11.540L12 21.350z"/></symbol>
    <symbol id="i-tree" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l5 7h-3l4 6h-4l3 4.500H7L10 15H6l4-6H7z"/><path fill="currentColor" d="M11 19.500h2V23h-2z"/></symbol>
    <symbol id="i-flake" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.700" stroke-linecap="round"><path d="M12 2.500v19M3.800 7.250l16.400 9.500M3.800 16.750l16.400-9.500"/><path d="M9.500 4.300L12 6.500l2.500-2.200M9.500 19.700L12 17.500l2.500 2.200"/></g></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path fill="currentColor" d="M12 22a2.200 2.200 0 002.200-2.200H9.800A2.200 2.200 0 0012 22zm6.500-6.600v-4.900c0-3.100-1.600-5.600-4.500-6.300V3.500a2 2 0 10-4 0v.7C7.100 4.900 5.500 7.400 5.500 10.500v4.900l-2 2v1.100h17v-1.100l-2-2z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path fill="currentColor" d="M17 9V7a5 5 0 00-10 0v2H5v12h14V9h-2zm-8-2a3 3 0 016 0v2H9V7z"/></symbol>
  </defs>
</svg>

<script src="js/content.js"></script>
<script src="js/lib.js"></script>
<script src="js/games.js"></script>
<script src="js/app.js"></script>
</body>
</html>
